[package]
name = "quads-tui"
version = "0.8.0"
edition = "2024"
repository = "https://github.com/NewtonChutney/quads-tui"
license = "MIT"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/quads-tui-{ target }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/quads-tui-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/quads-tui-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/quads-tui-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/quads-tui-windows-x86_64.exe"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
fs2 = "0.4"
semver = "1"
libc = "0.2"
